plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ihansuru.greetingtodo'
    compileSdk 36

    defaultConfig {
        applicationId 'com.ihansuru.greetingtodo'
        minSdk 23
        targetSdk 36
        versionCode 2
        versionName '1.0.1'
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError true
        checkReleaseBuilds false
    }
}
