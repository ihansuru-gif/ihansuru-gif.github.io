name: APK Broom Build

on:
  push:
    branches:
      - apkbroom-build-20260918
    paths:
      - .github/workflows/apkbroom-build.yml

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout build branch
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Resolve Android SDK
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "Installed platforms:"
          ls -1 "$ANDROID_HOME/platforms" 2>/dev/null || true
          echo "Installed build tools:"
          ls -1 "$ANDROID_HOME/build-tools" 2>/dev/null || true

          SDKMANAGER="$(find "$ANDROID_HOME" -type f -name sdkmanager -perm -111 2>/dev/null | head -n 1 || true)"
          if [ -n "$SDKMANAGER" ]; then
            echo "sdkmanager=$SDKMANAGER"
            if [ ! -d "$ANDROID_HOME/platforms/android-35" ] || [ ! -d "$ANDROID_HOME/build-tools/35.0.0" ]; then
              yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
              "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
            fi
          else
            echo "No sdkmanager found; relying on preinstalled SDK packages"
          fi

          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/build-tools/35.0.0"

      - name: Reconstruct APK Broom project
        shell: bash
        run: |
          set -euo pipefail
          cat apkbroom_payload.part00.b64               apkbroom_payload.part01.b64               apkbroom_payload.part02.b64               apkbroom_payload.part03.b64               apkbroom_payload.part04.b64               apkbroom_payload.part05.b64 | tr -d '\n\r' | base64 -d > /tmp/apkbroom_payload.zip
          rm -rf apkbroom-src
          mkdir -p apkbroom-src
          unzip -q /tmp/apkbroom_payload.zip -d apkbroom-src
          test -f apkbroom-src/app/src/main/AndroidManifest.xml

      - name: Test and build APK
        shell: bash
        run: |
          set -euo pipefail
          gradle -p apkbroom-src testDebugUnitTest assembleDebug --stacktrace
          mkdir -p output
          cp apkbroom-src/app/build/outputs/apk/debug/app-debug.apk output/APK_Broom-debug.apk
          sha256sum output/APK_Broom-debug.apk > output/APK_Broom-debug.apk.sha256

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: apkbroom-debug
          path: |
            output/APK_Broom-debug.apk
            output/APK_Broom-debug.apk.sha256
          if-no-files-found: error
          retention-days: 7

      - name: Write result marker
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_STATUS: ${{ job.status }}
          RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -u
          artifact_id=""
          if [ "$BUILD_STATUS" = "success" ]; then
            for i in $(seq 1 20); do
              artifact_id=$(curl -fsSL                 -H "Authorization: Bearer $GH_TOKEN"                 -H "Accept: application/vnd.github+json"                 "https://api.github.com/repos/$REPO/actions/runs/$RUN_ID/artifacts"                 | jq -r '.artifacts[] | select(.name=="apkbroom-debug") | .id'                 | head -n 1 || true)
              if [ -n "$artifact_id" ] && [ "$artifact_id" != "null" ]; then
                break
              fi
              sleep 2
            done
          fi
          sha=""
          if [ -f output/APK_Broom-debug.apk ]; then
            sha=$(sha256sum output/APK_Broom-debug.apk | cut -d' ' -f1)
          fi
          printf '{"status":"%s","run_id":"%s","artifact_id":"%s","sha256":"%s"}\n'             "$BUILD_STATUS" "$RUN_ID" "$artifact_id" "$sha" > apkbroom-build-result.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apkbroom-build-result.json
          git commit -m "APK Broom build result [skip ci]" || true
          git push origin HEAD:apkbroom-build-20260918 || true

