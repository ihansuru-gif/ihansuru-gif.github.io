name: Temporary APK Broom Final Build

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/__temp_apkbroom_final.yml

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout APK Broom build branch
        uses: actions/checkout@v4
        with:
          ref: apkbroom-build-20260918
          fetch-depth: 1

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ""

      - name: Install Android platform
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Reconstruct APK Broom project
        shell: bash
        run: |
          set -euo pipefail
          cat apkbroom_payload.part00.b64               apkbroom_payload.part01.b64               apkbroom_payload.part02.b64               apkbroom_payload.part03.b64               apkbroom_payload.part04.b64               apkbroom_payload.part05.b64 | tr -d '\n\r' | base64 -d > /tmp/apkbroom_payload.zip
          rm -rf apkbroom-src
          mkdir -p apkbroom-src
          unzip -q /tmp/apkbroom_payload.zip -d apkbroom-src

          cat apkbroom_override.part00.b64               apkbroom_override.part01.b64               apkbroom_override.part02.b64 | tr -d '\n\r' | base64 -d > /tmp/apkbroom_override.zip
          echo "482a9af8e20efa00253dbae973abbb9fd50dca7d6fd8de41035495d1721cb4cf  /tmp/apkbroom_override.zip" | sha256sum -c -
          unzip -qo /tmp/apkbroom_override.zip -d apkbroom-src

          tr -d '\n\r' < apkbroom_override2.b64 | base64 -d > /tmp/apkbroom_override2.zip
          echo "499140ee341e7281c8c7366826935943c8a9b3d6e6436ca13ad45eb34cae5fbc  /tmp/apkbroom_override2.zip" | sha256sum -c -
          unzip -qo /tmp/apkbroom_override2.zip -d apkbroom-src

          grep -q "versionName '1.1.0'" apkbroom-src/app/build.gradle
          grep -q 'CacheClearActivity' apkbroom-src/app/src/main/AndroidManifest.xml

      - name: Test and build APK
        shell: bash
        run: |
          set -euo pipefail
          gradle -p apkbroom-src testDebugUnitTest assembleDebug --stacktrace
          mkdir -p output
          cp apkbroom-src/app/build/outputs/apk/debug/app-debug.apk output/APK_Broom-v1.1.0-fixed.apk
          sha256sum output/APK_Broom-v1.1.0-fixed.apk > output/APK_Broom-v1.1.0-fixed.apk.sha256

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: apkbroom-v1.1.0-r2-final
          path: |
            output/APK_Broom-v1.1.0-fixed.apk
            output/APK_Broom-v1.1.0-fixed.apk.sha256
          if-no-files-found: error
          retention-days: 7

      - name: Write result marker to build branch
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_STATUS: ${{ job.status }}
          RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -u
          artifact_id=""
          if [ "$BUILD_STATUS" = "success" ]; then
            for i in $(seq 1 20); do
              artifact_id=$(curl -fsSL                 -H "Authorization: Bearer $GH_TOKEN"                 -H "Accept: application/vnd.github+json"                 "https://api.github.com/repos/$REPO/actions/runs/$RUN_ID/artifacts"                 | jq -r '.artifacts[] | select(.name=="apkbroom-v1.1.0-r2-final") | .id'                 | head -n 1 || true)
              if [ -n "$artifact_id" ] && [ "$artifact_id" != "null" ]; then break; fi
              sleep 2
            done
          fi
          sha=""
          if [ -f output/APK_Broom-v1.1.0-fixed.apk ]; then
            sha=$(sha256sum output/APK_Broom-v1.1.0-fixed.apk | cut -d' ' -f1)
          fi
          printf '{"status":"%s","version":"1.1.0-r2-final","run_id":"%s","artifact_id":"%s","sha256":"%s"}\n'             "$BUILD_STATUS" "$RUN_ID" "$artifact_id" "$sha" > apkbroom-build-result-final.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apkbroom-build-result-final.json
          git commit -m "APK Broom final build result [skip ci]" || true
          git push origin HEAD:apkbroom-build-20260918 || true
