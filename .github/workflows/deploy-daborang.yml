name: Deploy Dabolang update channel

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-daborang.yml'
      - 'scripts/**'
      - 'package.json'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Published release tag (example: v3.5.9-t.64)'
        required: false
        type: string
      deploy:
        description: Deploy the selected published release after QA
        required: true
        default: false
        type: boolean
      compat_probe_release_id:
        description: 'Optional draft release id containing an unpublished legacy-updater probe'
        required: false
        type: string
      compat_probe_asset_name:
        description: 'Optional probe EXE asset name; copied outside the live manifest'
        required: false
        type: string

concurrency:
  group: dabolang-public-update-channel
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  dispatch-release:
    if: ${{ github.event_name == 'release' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - name: Re-dispatch the published release from main
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: >-
          gh workflow run deploy-daborang.yml
          --repo "$GITHUB_REPOSITORY"
          --ref main
          -f release_tag="$RELEASE_TAG"
          -f deploy=true

  qa:
    if: ${{ github.event_name != 'release' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Run isolated dummy QA
        run: npm test

  build:
    needs: qa
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pages: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Resolve published release
        id: release
        shell: bash
        env:
          EVENT_TAG: ${{ github.event.release.tag_name }}
          MANUAL_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          tag="${EVENT_TAG:-${MANUAL_TAG:-}}"
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
      - name: Require a stable published release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          state=$(gh release view "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json isDraft,isPrerelease \
            --jq 'if (.isDraft == false and .isPrerelease == false) then "stable" else "blocked" end')
          test "$state" = "stable"
      - name: Download the three release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p incoming
          release_state=$(gh release view "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json isDraft,isPrerelease \
            --jq '[.isDraft,.isPrerelease] | @tsv')
          test "$release_state" = $'false\tfalse'
          assets=(
            "Dabolang-${VERSION}-Windows-x64.exe"
            "Dabolang-${VERSION}-macOS-arm64.zip"
            "Dabolang-${VERSION}-macOS-x64.zip"
          )
          for asset in "${assets[@]}"; do
            gh release download "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --pattern "$asset" \
              --dir incoming
            test -f "incoming/$asset"
          done
          gh release view "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json body \
            --jq '.body // ""' > incoming/release-notes.txt
      - name: Build verified Pages files
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: >-
          node scripts/build-site.js
          --tag "$RELEASE_TAG"
          --repository "$GITHUB_REPOSITORY"
          --assets incoming
          --notes-file incoming/release-notes.txt
          --output _site
      - name: Add optional unpublished legacy compatibility probe
        if: ${{ inputs.compat_probe_release_id != '' || inputs.compat_probe_asset_name != '' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PROBE_RELEASE_ID: ${{ inputs.compat_probe_release_id }}
          PROBE_ASSET_NAME: ${{ inputs.compat_probe_asset_name }}
        run: |
          set -euo pipefail
          [[ "$PROBE_RELEASE_ID" =~ ^[0-9]+$ ]]
          [[ "$PROBE_ASSET_NAME" =~ ^Dabolang-compat-probe-[0-9A-Za-z._-]+\.exe$ ]]
          asset_ids=$(gh api "repos/$GITHUB_REPOSITORY/releases/$PROBE_RELEASE_ID/assets" \
            --jq ".[] | select(.name == \"$PROBE_ASSET_NAME\") | .id")
          test "$(printf '%s\n' "$asset_ids" | sed '/^$/d' | wc -l)" -eq 1
          asset_id=$(printf '%s\n' "$asset_ids" | sed '/^$/d')
          probe_root="_site/daborang-jitsi-screen-gallery/compat-probe"
          mkdir -p "$probe_root"
          gh api "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id" \
            -H 'Accept: application/octet-stream' > "$probe_root/$PROBE_ASSET_NAME"
          test "$(head -c 2 "$probe_root/$PROBE_ASSET_NAME")" = 'MZ'
          test "$(stat -c %s "$probe_root/$PROBE_ASSET_NAME")" -ge 1048576
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
