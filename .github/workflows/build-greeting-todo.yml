name: Build GreetingTodo Android

on:
  push:
    branches:
      - build/android-greeting-todo
    paths:
      - 'android-greeting-todo/**'
      - '.github/workflows/build-greeting-todo.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-greeting-todo
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Unit tests
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Lint and build debug APK
        run: gradle --no-daemon :app:lintDebug :app:assembleDebug

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true

      - name: Interaction tests on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb shell input keyevent KEYCODE_WAKEUP
            adb shell wm dismiss-keyguard || true
            adb shell settings put system screen_off_timeout 2147483647
            gradle -p android-greeting-todo --no-daemon :app:connectedDebugAndroidTest

      - name: Prepare APK
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk GreetingTodo-1.5.0-debug.apk
          sha256sum GreetingTodo-1.5.0-debug.apk | tee GreetingTodo-1.5.0-debug.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GreetingTodo-Android-1.5.0-debug
          path: |
            android-greeting-todo/GreetingTodo-1.5.0-debug.apk
            android-greeting-todo/GreetingTodo-1.5.0-debug.sha256
            android-greeting-todo/app/build/reports/lint-results-debug.html
          if-no-files-found: error
          retention-days: 14
