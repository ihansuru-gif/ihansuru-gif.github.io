name: Build GreetingTodo Android

on:
  push:
    branches:
      - build/android-greeting-todo
    paths:
      - 'android-greeting-todo/**'
      - '.github/workflows/build-greeting-todo.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-greeting-todo
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Lint and build debug APK
        run: gradle --no-daemon :app:lintDebug :app:assembleDebug

      - name: Prepare APK
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk GreetingTodo-1.3.1-debug.apk
          sha256sum GreetingTodo-1.3.1-debug.apk | tee GreetingTodo-1.3.1-debug.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GreetingTodo-Android-1.3.1-debug
          path: |
            android-greeting-todo/GreetingTodo-1.3.1-debug.apk
            android-greeting-todo/GreetingTodo-1.3.1-debug.sha256
            android-greeting-todo/app/build/reports/lint-results-debug.html
          if-no-files-found: error
          retention-days: 14
